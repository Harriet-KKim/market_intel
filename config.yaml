vault_path: "./vault"
collection:
  interval_hours: 6
  # L5: Scheduler가 사용할 명시적 timezone (시스템 TZ 의존 제거)
  timezone: "Asia/Seoul"
  sources:
    rss: true
    web: true
    sns: true
    youtube: true
refinery:
  schedule_day: "monday"
  schedule_hour: 9
api_keys:
  gemini: "${GEMINI_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
budget:
  enabled: false
  daily_limit_usd: 10.0
# L3: dedup.db 경로 (미지정 시 `{vault_path}/.dedup.db` 사용)
# dedup:
#   db_path: "./dedup.db"
